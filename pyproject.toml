[project]
name = "ratio-mcp"
version = "0.2.0"
description = "Read-only MCP server for the ratio knowledge vault and live environment status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
ratio-mcp = "ratio_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

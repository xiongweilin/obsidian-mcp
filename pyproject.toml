[project]
name = "obsidian-mcp"
version = "0.3.0"
description = "Read-only MCP server for the Obsidian knowledge vault and live environment status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3",
    "pydantic>=2.14.1,<3",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3,<7",
    "pytest>=9,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "contract: wire-level MCP contract tests using the stdlib JSON-RPC client",
    "lifecycle: real-subprocess MCP lifecycle tests",
    "windows_only: requires a Windows host (process tree / pwsh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# 棘轮：当前 CI 子集覆盖率为 81.83%（分支）。只能提高，不能降低。
fail_under = 81
show_missing = true

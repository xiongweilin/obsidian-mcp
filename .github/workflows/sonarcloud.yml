name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    # Dependabot pull requests never receive repository secrets, so the scan
    # cannot authenticate. Push-to-main runs and human PRs still analyze.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Generate Python coverage report
        run: >-
          uv run pytest -q -m "not windows_only and not contract"
          --cov --cov-branch --cov-report=xml:coverage.xml
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
